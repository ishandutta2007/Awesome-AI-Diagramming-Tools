<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#334155" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseNode {
        0%, 100% { r: 6px; opacity: 0.8; filter: drop-shadow(0 0 4px #38bdf8); }
        50% { r: 8.5px; opacity: 1; filter: drop-shadow(0 0 10px #818cf8); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.6; }
      }
      .node-pulse-1 { animation: pulseNode 3s infinite ease-in-out; }
      .node-pulse-2 { animation: pulseNode 3s infinite ease-in-out 1s; }
      .node-pulse-3 { animation: pulseNode 3s infinite ease-in-out 2s; }
      .line-flow { stroke-dasharray: 6, 6; animation: dashFlow 2s linear infinite; }
      .floating-card-1 { animation: floatSlow 5s ease-in-out infinite; }
      .floating-card-2 { animation: floatReverse 6s ease-in-out infinite; }
      .ambient-glow { animation: pulseGlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Ambient background glow blobs -->
  <circle cx="200" cy="100" r="180" fill="#4f46e5" opacity="0.18" filter="url(#glow)" class="ambient-glow" />
  <circle cx="1000" cy="260" r="160" fill="#06b6d4" opacity="0.15" filter="url(#glow)" class="ambient-glow" />
  <circle cx="600" cy="180" r="220" fill="#9333ea" opacity="0.12" filter="url(#glow)" class="ambient-glow" />

  <!-- Background Dynamic Network Nodes & Connectors (Subtle background layer) -->
  <g opacity="0.45">
    <path d="M 80 180 Q 200 80 340 180 T 600 180 T 860 180 T 1120 180" fill="none" stroke="#4338ca" stroke-width="2" class="line-flow" />
    <path d="M 120 280 C 260 140, 400 320, 540 220 S 820 100, 1080 200" fill="none" stroke="#0891b2" stroke-width="1.5" class="line-flow" />
  </g>

  <!-- Left Side Visual Element: AI Diagram Canvas / Architecture Widget -->
  <g class="floating-card-1" transform="translate(70, 70)">
    <rect width="180" height="110" rx="12" fill="#1e1b4b" fill-opacity="0.6" stroke="#6366f1" stroke-width="1.5" filter="url(#soft-glow)" />
    <text x="18" y="32" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="1">CODE / AGENT</text>
    <rect x="18" y="44" width="144" height="6" rx="3" fill="#312e81" />
    <rect x="18" y="58" width="110" height="6" rx="3" fill="#4338ca" />
    <rect x="18" y="72" width="80" height="6" rx="3" fill="#6366f1" />
    <circle cx="152" cy="88" r="7" fill="#38bdf8" class="node-pulse-1" />
  </g>

  <g class="floating-card-2" transform="translate(100, 210)">
    <rect width="160" height="90" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#0284c7" stroke-width="1.2" />
    <path d="M 30 45 L 80 25 L 130 55" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="30" cy="45" r="5" fill="#38bdf8" class="node-pulse-2" />
    <circle cx="80" cy="25" r="5" fill="#818cf8" class="node-pulse-3" />
    <circle cx="130" cy="55" r="5" fill="#c084fc" class="node-pulse-1" />
    <text x="30" y="75" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Architecture Map</text>
  </g>

  <!-- Right Side Visual Element: Visual Flow / Cloud Topology Cards -->
  <g class="floating-card-2" transform="translate(940, 60)">
    <rect width="190" height="120" rx="12" fill="#1e1b4b" fill-opacity="0.65" stroke="#a855f7" stroke-width="1.5" filter="url(#soft-glow)" />
    <text x="20" y="32" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="1">AGENT-NATIVE SVG</text>
    <circle cx="45" cy="72" r="16" fill="#581c87" stroke="#c084fc" stroke-width="1.5" />
    <path d="M 61 72 L 95 72" stroke="#e879f9" stroke-width="2" stroke-dasharray="3,3" />
    <polygon points="95,68 103,72 95,76" fill="#e879f9" />
    <rect x="105" y="56" width="65" height="32" rx="6" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.2" />
    <text x="117" y="76" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Vector</text>
  </g>

  <g class="floating-card-1" transform="translate(960, 210)">
    <rect width="170" height="85" rx="10" fill="#0f172a" fill-opacity="0.75" stroke="#06b6d4" stroke-width="1.2" />
    <text x="20" y="28" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11">Multi-Modal Flow</text>
    <circle cx="35" cy="54" r="6" fill="#06b6d4" class="node-pulse-3" />
    <circle cx="85" cy="54" r="6" fill="#3b82f6" class="node-pulse-2" />
    <circle cx="135" cy="54" r="6" fill="#a855f7" class="node-pulse-1" />
    <line x1="41" y1="54" x2="79" y2="54" stroke="#475569" stroke-width="2" />
    <line x1="91" y1="54" x2="129" y2="54" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Center Foreground Content: Guaranteed completely clear of dynamic overlaps -->
  <g transform="translate(600, 110)" text-anchor="middle">
    <!-- Category Badge Pill -->
    <rect x="-140" y="-34" width="280" height="28" rx="14" fill="#312e81" fill-opacity="0.8" stroke="#818cf8" stroke-width="1" />
    <text x="0" y="-16" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">⚡ CURATED ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="0" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="-1">
      Awesome AI Diagramming Tools
    </text>

    <!-- Subtitle -->
    <text x="0" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="17" letter-spacing="0.2">
      Agent-Native Design · Diagram-as-Code · Architecture Mapping · Editorial Visuals
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 114)">
      <rect x="-240" y="0" width="105" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="-187" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">✦ Text-to-Diagram</text>

      <rect x="-120" y="0" width="105" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="-67" y="16" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">✦ MCP Servers</text>

      <rect x="0" y="0" width="115" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="57" y="16" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">✦ Open-Source</text>

      <rect x="130" y="0" width="110" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="185" y="16" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">✦ Enterprise SaaS</text>
    </g>
  </g>
</svg>
